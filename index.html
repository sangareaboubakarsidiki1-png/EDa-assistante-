<div id="keybox" style="width:96vw;max-width:480px;padding:8px;display:flex;gap:6px;">
  <input id="keyinput" placeholder="Colle ici ta clé gsk_..." style="flex:1;padding:12px;border-radius:15px;border:1px solid gold;background:#111;color:gold;font-size:11px;">
  <button id="keysave" style="padding:12px;border-radius:15px;background:gold;border:none;font-weight:700;">SAUVER</button>
</div>

<script>
let GROQ_API_KEY = localStorage.getItem('eda_groq_key');
const keybox = document.getElementById('keybox');
if(GROQ_API_KEY){ keybox.style.display='none'; }

document.getElementById('keysave').onclick=()=>{
  let k = document.getElementById('keyinput').value.trim();
  if(k.startsWith('gsk_') && k.length>50){
    localStorage.setItem('eda_groq_key', k);
    GROQ_API_KEY = k;
    keybox.style.display='none';
    parler('Clé sauvée '+MEMOIRE.nom+'! Je suis vivante maintenant, teste-moi: dis Bonjour');
  } else {
    alert('Colle la clé complète qui commence par gsk_ et qui est très longue');
  }
};
</script>
